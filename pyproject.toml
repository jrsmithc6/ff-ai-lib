[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ff-ai-lib"
version = "0.1.0"
description = "Read-only Sleeper league snapshots for human and AI fantasy managers"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
ff-ai = "ff_ai_lib.__main__:main"

[tool.setuptools.packages.find]
include = ["ff_ai_lib*"]
